name: Mangekyo
options:
  bundleIdPrefix: com.fairchild
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    GCC_PREPROCESSOR_DEFINITIONS:
      - "HAVE_METAL=1"
      - "GPU_BENCH_NO_GLFW=1"

targets:
  Mangekyo:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Mangekyo
    settings:
      base:
        MOLTENVK_SLICE[sdk=iphoneos*]: ios-arm64
        MOLTENVK_SLICE[sdk=iphonesimulator*]: ios-arm64_x86_64-simulator
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.fairchild.Mangekyo
        INFOPLIST_FILE: Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Mangekyo/Engine/GPUBenchmark-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - '"$(PROJECT_DIR)/../src"'
        LIBRARY_SEARCH_PATHS:
          - '"$(PROJECT_DIR)/../build-ios/$(CONFIGURATION)-$(PLATFORM_NAME)/$(CONFIGURATION)-$(PLATFORM_NAME)"'
          - '"$(PROJECT_DIR)/../build-ios/dependencies/MoltenVK/MoltenVK/static/MoltenVK.xcframework/$(MOLTENVK_SLICE)"'
        OTHER_LDFLAGS:
          - "-lgpu_engine"
          - "-lMoltenVK"
          - "-framework IOSurface"
          - "-framework OpenGLES"
          - "-framework CoreGraphics"
          - "-lc++"
          - "-framework Metal"
          - "-framework MetalKit"
          - "-framework QuartzCore"
          - "-framework UIKit"
          - "-framework CoreFoundation"
          - "-framework Foundation"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_ENABLE_OBJC_ARC: "YES"

    postBuildScripts:
      - name: Bundle runtime Metal sources
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          for shader in particle.metal gpu_burn.metal cinematic_liquid_v2.metal gpu_burn_es2.vert gpu_burn_es2.frag; do
            install -m 0644 "$PROJECT_DIR/../shaders/$shader" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/$shader"
          done
          spv_dir="$PROJECT_DIR/../build-ios/$CONFIGURATION-$PLATFORM_NAME"
          for shader in "$spv_dir"/*.spv; do
            [ -f "$shader" ] || continue
            install -m 0644 "$shader" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/$(basename "$shader")"
          done
          install -m 0644 "$PROJECT_DIR/../build-ios/dependencies/MoltenVK/LICENSE" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/MoltenVK-LICENSE"
        inputFiles:
          - "$(PROJECT_DIR)/../shaders/particle.metal"
          - "$(PROJECT_DIR)/../shaders/gpu_burn.metal"
          - "$(PROJECT_DIR)/../shaders/cinematic_liquid_v2.metal"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/particle.metal"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/gpu_burn.metal"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/cinematic_liquid_v2.metal"

  MangekyoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MangekyoTests
    dependencies:
      - target: Mangekyo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: Mangekyo/Engine/GPUBenchmark-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - '"$(PROJECT_DIR)/Mangekyo/Engine"'

  MangekyoUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MangekyoUITests
    dependencies:
      - target: Mangekyo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"

schemes:
  Mangekyo:
    build:
      targets:
        Mangekyo: all
    test:
      targets:
        - MangekyoTests
        - MangekyoUITests
