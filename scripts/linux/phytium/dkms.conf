PACKAGE_NAME="dwmac-phytium"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="dwmac-phytium"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
# The stmmac headers in stmmac/ come from a 7.0 kernel; the glue shares
# struct stmmac_resources with the stmmac core, so a kernel whose stmmac
# headers may differ (7.1 and later) gets no build rather than a wrong one.
BUILD_EXCLUSIVE_KERNEL="^7\.0\."
