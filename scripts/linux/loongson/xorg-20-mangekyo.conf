# LS7A1000 display controller. glamor draws on the GC1000 GPU beside it
# (etnaviv), straight into the controller's VRAM: that needs the patched
# loongson and etnaviv modules in /lib/modules/*/updates and the patched Mesa
# in /opt/mesa-ls7a, which lightdm starts the X server with. Before: "none".
Section "Device"
    Identifier "LS7A1000 DC"
    Driver "modesetting"
    Option "AccelMethod" "glamor"
EndSection

# A test machine: never blank or power down the screen.
Section "ServerFlags"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
