# Test machine: log fairchild in to Xfce by itself; re-initialise the MS7210
# HDMI bridge once X has set the mode (see /usr/local/sbin/ms7210-init).
# The X server alone loads the patched Mesa in /opt/mesa-ls7a (glamor on the
# GC1000, see /etc/X11/xorg.conf.d/20-mangekyo.conf).
[Seat:*]
autologin-user=fairchild
autologin-session=xfce
user-session=xfce
display-setup-script=/usr/local/sbin/ms7210-init
xserver-command=env LD_LIBRARY_PATH=/opt/mesa-ls7a/lib /usr/libexec/Xorg
