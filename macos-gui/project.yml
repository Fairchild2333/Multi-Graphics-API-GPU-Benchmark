name: GPUBenchmark
options:
  bundleIdPrefix: com.fairchild
  deploymentTarget:
    macOS: "12.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    SUPPORTED_PLATFORMS: macosx
    # scripts/build-macos.sh overrides these for custom output directories.
    # The defaults match its source-built, static GLFW layout and avoid any
    # Apple Silicon/Intel Homebrew prefix in the project.
    GPU_BENCH_NATIVE_LIB_DIR: "$(PROJECT_DIR)/../out/build/macos-$(NATIVE_ARCH_ACTUAL)-$(CONFIGURATION)"
    GPU_BENCH_GLFW_LIB_DIR: "$(GPU_BENCH_NATIVE_LIB_DIR)/_deps/glfw-build/src"

targets:
  GPUBenchmark:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: GPUBenchmark
    settings:
      base:
        PRODUCT_NAME: Mangekyo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.fairchild.GPUBenchmark
        SWIFT_OBJC_BRIDGING_HEADER: GPUBenchmark/Engine/GPUBenchmark-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/../src"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          # Preserve spaces in the repository path after nested expansion.
          - '"$(GPU_BENCH_NATIVE_LIB_DIR)"'
          - '"$(GPU_BENCH_GLFW_LIB_DIR)"'
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lgpu_engine"
          - "-lglfw3"
          - "-framework Metal"
          - "-framework QuartzCore"
          - "-framework Cocoa"
          - "-framework CoreFoundation"
          - "-framework Foundation"
          - "-framework IOKit"
          - "-weak_framework Charts"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    info:
      path: Info.plist
      properties:
        CFBundleName: Mangekyo
        CFBundleDisplayName: Mangekyo
        CFBundleShortVersionString: "0.2.6"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "12.0"
        LSApplicationCategoryType: "public.app-category.utilities"
        MetalCaptureEnabled: true
        NSHighResolutionCapable: true
